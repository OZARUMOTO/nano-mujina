[package]
name = "nano-pool"
version = "0.1.0"
edition = "2021"

[dependencies]
stratum-apps = "0.7.0"
noise_sv2 = "1.4"
async-channel = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitcoin = "0.32"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
